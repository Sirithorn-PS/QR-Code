<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <rect width="1200" height="675" fill="#f8fafc" rx="16"/>
  <!-- Top Window Bar -->
  <rect width="1200" height="40" fill="#0f172a" rx="16"/>
  <rect y="24" width="1200" height="16" fill="#0f172a"/>
  <circle cx="24" cy="20" r="6" fill="#ef4444"/>
  <circle cx="44" cy="20" r="6" fill="#f59e0b"/>
  <circle cx="64" cy="20" r="6" fill="#10b981"/>
  <rect x="100" y="10" width="400" height="20" rx="6" fill="#1e293b"/>
  <text x="120" y="24" fill="#94a3b8" font-family="sans-serif" font-size="11">https://wpk-mms.internal/inventory</text>

  <!-- Sidebar -->
  <rect x="0" y="40" width="220" height="635" fill="#0f172a"/>
  <text x="24" y="80" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="18">WPK <tspan fill="#be1111">MMS</tspan></text>
  <text x="40" y="135" fill="#94a3b8" font-family="sans-serif" font-size="14">สแกน QR Code</text>
  <text x="40" y="180" fill="#94a3b8" font-family="sans-serif" font-size="14">หน้าหลัก</text>
  <rect x="16" y="210" width="188" height="40" rx="8" fill="#be1111" opacity="0.15"/>
  <rect x="20" y="215" width="4" height="30" rx="2" fill="#be1111"/>
  <text x="40" y="235" fill="#be1111" font-family="sans-serif" font-weight="bold" font-size="14">สต็อกสินค้า</text>

  <!-- Main Content -->
  <text x="260" y="90" fill="#0f172a" font-family="sans-serif" font-weight="bold" font-size="24">สต็อกสินค้าและตำแหน่งจัดเก็บ (Stock Inventory)</text>
  
  <!-- Search Bar -->
  <rect x="260" y="115" width="400" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="280" y="140" fill="#94a3b8" font-family="sans-serif" font-size="13">🔍 ค้นหาด้วย Item Code หรือชื่อสินค้า...</text>

  <!-- Table Container -->
  <rect x="260" y="170" width="900" height="390" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="260" y="170" width="900" height="48" rx="16" fill="#f1f5f9"/>
  <text x="290" y="200" fill="#475569" font-family="sans-serif" font-weight="bold" font-size="13">Item Code</text>
  <text x="440" y="200" fill="#475569" font-family="sans-serif" font-weight="bold" font-size="13">รายการบรรจุภัณฑ์</text>
  <text x="680" y="200" fill="#475569" font-family="sans-serif" font-weight="bold" font-size="13">คลัง / ตำแหน่ง</text>
  <text x="880" y="200" fill="#475569" font-family="sans-serif" font-weight="bold" font-size="13">จำนวนคงเหลือ</text>

  <!-- Row 1 -->
  <line x1="260" y1="218" x2="1160" y2="218" stroke="#e2e8f0"/>
  <text x="290" y="250" fill="#be1111" font-family="sans-serif" font-weight="bold" font-size="13">YM-PK-88412</text>
  <text x="440" y="250" fill="#0f172a" font-family="sans-serif" font-weight="bold" font-size="13">กล่องน้ำมันเครื่อง Yamalube 4L</text>
  <text x="680" y="250" fill="#64748b" font-family="sans-serif" font-size="13">WPK / A-04-12</text>
  <text x="880" y="250" fill="#0f172a" font-family="sans-serif" font-weight="bold" font-size="14">1,450 ชิ้น</text>

  <!-- Row 2 -->
  <line x1="260" y1="278" x2="1160" y2="278" stroke="#e2e8f0"/>
  <text x="290" y="310" fill="#be1111" font-family="sans-serif" font-weight="bold" font-size="13">YM-PK-55102</text>
  <text x="440" y="310" fill="#0f172a" font-family="sans-serif" font-weight="bold" font-size="13">แกลลอนพลาสติก 1L (Yamalube AT)</text>
  <text x="680" y="310" fill="#64748b" font-family="sans-serif" font-size="13">WPK / B-02-05</text>
  <text x="880" y="310" fill="#0f172a" font-family="sans-serif" font-weight="bold" font-size="14">820 ชิ้น</text>
</svg>
